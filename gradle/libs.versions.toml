[versions]
kotlin = "2.4.21"
# Kotlin standard library the library declares; keeps consumers on Kotlin 2.2 or newer supported.
kotlinStdlib = "2.2.21"
dokka = "2.3.0"
spotless = "8.10.4"
ktlint = "1.8.0"
animalsniffer = "2.0.1"
animalsnifferTool = "1.28"
gummyBears = "0.16.0"
bouncycastle = "1.86"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"

[libraries]
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Java API signature of Android API level 26, without core library desugaring.
gummy-bears-api26 = { module = "com.toasttab.android:gummy-bears-api-26", version.ref = "gummyBears" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
